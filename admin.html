<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — DrinkValley</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* estilos extras usados apenas no admin */
    :root {
      --card: #071224;
      --muted: #9aa6b2;
      --accent: #f6b046;
      --danger: #f44336;
    }
    .admin-main { padding: 24px; max-width: 1200px; margin: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    .form-card, .card { background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .01)); border: 1px solid rgba(255, 255, 255, .08); border-radius: 20px; padding: 24px; }

    .admin-products { display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow: auto; }
    .admin-card { background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 12px; }
    .admin-card summary { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .admin-card summary img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    .admin-form { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .admin-form label { font-size: .9rem; color: var(--muted); }
    .admin-form input, .admin-form textarea, .admin-form select {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: #fff; margin-top: 4px;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
    .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .check { display: flex; align-items: center; gap: 6px; }

    /* Novos estilos para upload de imagens */
    .image-slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 12px 0; }
    .image-slot {
      aspect-ratio: 1;
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      background: rgba(255,255,255,.02);
      user-select: none;
    }
    .image-slot:hover { border-color: var(--accent); background: rgba(246,176,70,.05); }
    .image-slot.has-image { border-style: solid; border-color: var(--accent); }
    .image-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .image-slot .placeholder {
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .image-slot .placeholder::before { content: "📷"; font-size: 1.5rem; }
    .image-slot .remove-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .image-slot.has-image .remove-btn { display: flex; }
    .image-slot.drag-over { border-color: var(--accent); background: rgba(246,176,70,.1); transform: scale(1.05); }

    /* Botões melhorados */
    .btn-primary {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(246,176,70,.3); }
    .btn-secondary {
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,.2);
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-secondary:hover { background: rgba(255,255,255,.15); }

    .edit-images-btn {
      background: rgba(255,255,255,.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,.2);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
    }
    .edit-images-btn:hover { background: rgba(255,255,255,.15); }

    .image-preview-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .image-preview-item {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
    }
    .image-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Drag and drop */
    .image-slot[draggable="true"] {
      cursor: move;
    }
    .image-slot[draggable="true"]:hover {
      box-shadow: 0 4px 12px rgba(255,255,255,.1);
    }
    .image-slot.dragging {
      opacity: 0.5;
      transform: rotate(5deg);
    }
  </style>
  <script type="module" src="admin.js" defer></script>
  <link rel="shortcut icon" href="images/logoDrinkValley.png" type="image/x-icon">
</head>
<body>
  <main class="container admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Admin — DrinkValley</h2>
      <img src="images/logoDrinkValley.png" alt="logo" style="height:44px" />
    </div>

    <!-- LOGIN -->
    <form id="login-form" class="card form-card">
      <h3>Login</h3>
      <input name="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Senha" required>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <!-- ÁREA ADMIN -->
    <section id="admin-area" style="display:none;margin-top:18px">
      <div class="grid-2">
        <!-- NOVO PRODUTO -->
        <form id="new-product-form" class="card">
          <h3>Novo produto</h3>
          <input name="title" placeholder="Nome do produto" required>
          <input name="slug" placeholder="Slug (espumante-rio-sol)" required>
          <textarea name="description" placeholder="Descrição"></textarea>
          <div class="grid-3">
            <input name="price" type="number" step="0.01" placeholder="Preço" required>
            <input name="compare_at_price" type="number" step="0.01" placeholder="Preço anterior">
            <input name="stock" type="number" min="0" placeholder="Estoque">
          </div>
          <div class="grid-3">
            <input name="volume_ml" type="number" placeholder="Volume (ml)">
            <input name="abv" type="number" step="0.1" placeholder="Teor alcoólico (%)">
            <select name="category_id" required></select>
          </div>
          <label class="check"><input type="checkbox" name="is_featured"> Destaque</label>

          <label>Imagens do produto (mínimo 1):</label>
          <div class="image-slots" id="image-slots">
            <!-- Slots serão criados pelo JavaScript -->
          </div>

          <button type="submit" class="btn-primary">Cadastrar Produto</button>
        </form>

        <!-- DASHBOARD + LISTA -->
        <div class="card">
          <h3>Dashboard</h3>
          <div id="dashboard-counters">
            <div>Produtos: <strong id="count-products">0</strong></div>
            <div>Pedidos: <strong id="count-orders">0</strong></div>
            <div>Vendas (R$): <strong id="count-sales">0.00</strong></div>
          </div>

          <h4 style="margin-top:12px">Produtos cadastrados</h4>
          <div id="products-list" class="admin-products"></div>

          <button id="logout-btn" class="btn-secondary" style="margin-top:12px">Sair</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal para editar imagens -->
  <div id="image-edit-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--card); padding:24px; border-radius:20px; max-width:600px; width:90%;">
      <h3>Editar Imagens</h3>
      <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 16px;">Arraste os slots para reordenar as imagens</p>
      <div class="image-slots" id="edit-image-slots"></div>
      <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px;">
        <button id="cancel-image-edit" class="btn-secondary">Cancelar</button>
        <button id="save-images" class="btn-primary">Salvar Imagens</button>
      </div>
    </div>
  </div>
</body>
</html>
