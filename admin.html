<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — DrinkValley</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* estilos extras usados apenas no admin */
    :root {
      --card: #071224;
      --muted: #9aa6b2;
      --accent: #f6b046;
      --danger: #f44336;
    }
    .admin-main { padding: 24px; max-width: 1200px; margin: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    .form-card, .card { background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .01)); border: 1px solid rgba(255, 255, 255, .08); border-radius: 20px; padding: 24px; }

    .admin-products { display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow: auto; }
    .admin-card { background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 12px; }
    .admin-card summary { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .admin-card summary img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    .admin-form { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .admin-form label { font-size: .9rem; color: var(--muted); }
    .admin-form input, .admin-form textarea, .admin-form select {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.04); color: #fff; margin-top: 4px;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
    .btn-danger { background: var(--danger); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .check { display: flex; align-items: center; gap: 6px; }
  </style>
  <script type="module" src="admin.js" defer></script>
  <link rel="shortcut icon" href="images/logoDrinkValley.png" type="image/x-icon">
</head>
<body>
  <main class="container admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>Admin — DrinkValley</h2>
      <img src="images/logoDrinkValley.png" alt="logo" style="height:44px" />
    </div>

    <!-- LOGIN -->
    <form id="login-form" class="card form-card">
      <h3>Login</h3>
      <input name="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Senha" required>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <!-- ÁREA ADMIN -->
    <section id="admin-area" style="display:none;margin-top:18px">
      <div class="grid-2">
        <!-- NOVO PRODUTO -->
        <form id="new-product-form" class="card">
          <h3>Novo produto</h3>
          <input name="title" placeholder="Nome do produto" required>
          <input name="slug" placeholder="Slug (espumante-rio-sol)" required>
          <textarea name="description" placeholder="Descrição"></textarea>
          <div class="grid-3">
            <input name="price" type="number" step="0.01" placeholder="Preço" required>
            <input name="compare_at_price" type="number" step="0.01" placeholder="Preço anterior">
            <input name="stock" type="number" min="0" placeholder="Estoque">
          </div>
          <div class="grid-3">
            <input name="volume_ml" type="number" placeholder="Volume (ml)">
            <input name="abv" type="number" step="0.1" placeholder="Teor alcoólico (%)">
            <select name="category_id" required></select>
          </div>
          <label class="check"><input type="checkbox" name="is_featured"> Destaque</label>

          <label>Imagens (pilha):</label>
          <input type="file" id="product-images" accept="image/*" multiple required>
          <div id="preview-images" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"></div>

          <button type="submit" class="btn-primary">Cadastrar Produto</button>
        </form>

        <!-- DASHBOARD + LISTA -->
        <div class="card">
          <h3>Dashboard</h3>
          <div id="dashboard-counters">
            <div>Produtos: <strong id="count-products">0</strong></div>
            <div>Pedidos: <strong id="count-orders">0</strong></div>
            <div>Vendas (R$): <strong id="count-sales">0.00</strong></div>
          </div>

          <h4 style="margin-top:12px">Produtos cadastrados</h4>
          <div id="products-list" class="admin-products"></div>

          <button id="logout-btn" class="btn-primary" style="margin-top:12px">Sair</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
